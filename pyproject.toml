[project]
name = "sas"
version = "0.1.0"
description = "Selection Against Safety: does an LLM coordinator route work away from correctly-objecting workers?"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
